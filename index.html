<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>リアルタイム地震情報</title>

<style>
body{
 font-family:sans-serif;
 max-width:700px;
 margin:auto;
 padding:15px;
}
.card{
 border:1px solid #ccc;
 border-radius:10px;
 padding:10px;
 margin-top:10px;
}
.eewForecast{background:#e8f4ff;}
.eewWarning{background:#ffe5e5;}
button{margin-top:10px;padding:8px;}
</style>
</head>

<body>

<h2>リアルタイム地震情報</h2>

<div id="quake">読み込み中...</div>

<button onclick="copyText()">コピー</button>

<audio id="forecastSound" src="sounds/forecast.mp3"></audio>
<audio id="warningSound" src="sounds/warning.mp3"></audio>

<script>

let lastID = "";
let latestText = "";

function convertScale(scale){
 if(scale==10)return "震度1";
 if(scale==20)return "震度2";
 if(scale==30)return "震度3";
 if(scale==40)return "震度4";
 if(scale==45)return "震度5弱";
 if(scale==50)return "震度5強";
 if(scale==55)return "震度6弱";
 if(scale==60)return "震度6強";
 if(scale==70)return "震度7";
 return scale;
}

function playEEWSound(type){
 if(type==="forecast"){
   document.getElementById("forecastSound").play();
 }
 if(type==="warning"){
   document.getElementById("warningSound").play();
 }
}

async function loadQuake(){

 const res = await fetch("https://api.p2pquake.net/v2/history?limit=1");
 const json = await res.json();

 const data = json[0];

 let text="";
 let cardClass="card";

 if(data.code==556){ // EEW

   const serial = data.issue.serial || "";
   const place = data.earthquake.hypocenter.name;
   const mag = data.earthquake.hypocenter.magnitude;
   const scale = convertScale(data.earthquake.maxScale);

   if(data.issue.type==="Forecast"){
      cardClass+=" eewForecast";
      playEEWSound("forecast");
   }

   if(data.issue.type==="Warning"){
      cardClass+=" eewWarning";
      playEEWSound("warning");
   }

   text=`【緊急地震速報 第${serial}報】
震源：${place}
M${mag}
最大${scale}`;

 }else{

   const place = data.earthquake.hypocenter.name;
   const mag = data.earthquake.hypocenter.magnitude;
   const scale = convertScale(data.earthquake.maxScale);

   text=`【地震情報】
震源：${place}
M${mag}
最大${scale}`;
 }

 latestText=text;

 if(lastID!==data.id){
   lastID=data.id;
 }

 document.getElementById("quake").innerHTML=
 `<div class="${cardClass}">${text}</div>`;
}

function copyText(){
 navigator.clipboard.writeText(latestText);
 alert("コピーしました");
}

loadQuake();
setInterval(loadQuake,5000);

</script>

</body>
</html>
